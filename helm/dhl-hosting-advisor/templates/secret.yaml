{{/* Sticky across upgrades: reuse the existing key if this release has one
     already, so `helm upgrade` never silently invalidates every session. */}}
{{- $existing := lookup "v1" "Secret" .Values.namespace (printf "%s-secrets" (include "dha.name" .)) }}
{{- $jwtKey := .Values.jwtSigningKey }}
{{- if not $jwtKey }}
  {{- if $existing }}
    {{- $jwtKey = index $existing.data "jwt-signing-key" | b64dec }}
  {{- else }}
    {{- $jwtKey = randAlphaNum 32 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dha.name" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "dha.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-signing-key: {{ $jwtKey | quote }}
  oidc-client-secret: {{ .Values.auth.clientSecret | default "dev-secret" | quote }}
