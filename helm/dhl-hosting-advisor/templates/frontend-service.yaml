apiVersion: v1
kind: Service
metadata:
  name: {{ include "dha.name" . }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "dha.componentLabels" (dict "component" "frontend" "Release" .Release) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
  ports:
    - port: 8080
      targetPort: 8080
