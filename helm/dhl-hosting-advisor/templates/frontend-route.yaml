apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "dha.name" . }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "dha.componentLabels" (dict "component" "frontend" "Release" .Release) | nindent 4 }}
spec:
  host: {{ include "dha.frontendHost" . }}
  to:
    kind: Service
    name: {{ include "dha.name" . }}-frontend
  port:
    targetPort: 8080
  {{- if .Values.route.tls }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  {{- end }}
