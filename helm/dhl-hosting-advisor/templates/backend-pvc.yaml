apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dha.name" . }}-backend-data
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "dha.componentLabels" (dict "component" "backend" "Release" .Release) | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.backend.storage.size }}
  {{- if .Values.backend.storage.storageClassName }}
  storageClassName: {{ .Values.backend.storage.storageClassName }}
  {{- end }}
