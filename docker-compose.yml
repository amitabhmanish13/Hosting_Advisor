name: dhl-hosting-advisor

services:
  mock-idp:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "app.auth.mock_idp:app", "--host", "0.0.0.0", "--port", "8100"]
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8100/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    ports:
      - "8100:8100"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/dha.db
      OIDC_ISSUER: http://mock-idp:8100
    depends_on:
      mock-idp:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    env_file: .env
    depends_on:
      - backend
    ports:
      - "3000:8080"

volumes:
  backend-data:
